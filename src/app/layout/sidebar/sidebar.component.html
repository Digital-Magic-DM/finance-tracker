<aside class="sidebar">
  <!-- Brand Header -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <img src="/assets/applogo.png" alt="Logo" style="width: 20px; height: 20px; object-fit: contain;" />
      </div>
      <span class="logo-text">DM Finance</span>
    </div>
    <button class="close-btn btn-icon" (click)="closeSidebar.emit()">✕</button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <span class="nav-label">MAIN MENU</span>
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="closeSidebar.emit()">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
        <span class="nav-arrow">›</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button class="sign-out-btn" (click)="signOut()">
      <span>⏻</span>
      <span>Sign Out</span>
    </button>
    <p class="version">v1.0.0 · DM Finance</p>
  </div>
</aside>
