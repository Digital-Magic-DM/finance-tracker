<aside class="sidebar">
  <!-- Brand Header -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <img src="/assets/applogo.png" alt="Logo" style="width: 20px; height: 20px; object-fit: contain;" />
      </div>
      <div class="logo-text brand-name"><span class="ash">DM</span> <span class="black">FinTracker</span></div>
    </div>
    <button class="close-btn btn-icon" (click)="closeSidebar.emit()">✕</button>
  </div>


  <!-- Navigation -->
  <nav class="sidebar-nav">
    <span class="nav-label">MAIN MENU</span>
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="closeSidebar.emit()">
        <span class="nav-icon material-icons">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
        <span class="nav-arrow material-icons">chevron_right</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    
    @if (pwaService.canInstall()) {
      <div class="sidebar-pwa-promo footer-pwa" (click)="pwaService.installApp(); closeSidebar.emit()">
        <span class="material-icons">install_mobile</span>
        <div class="pwa-text">
          <span class="pwa-title">Install App</span>
          <span class="pwa-subtitle">Click to install</span>
        </div>
      </div>
    }

    <button class="footer-btn sign-out-btn" (click)="signOut()">
      <span class="material-icons">logout</span>
      <span>Sign Out</span>
    </button>
    <p class="version">v1.0.0 · DM FinTracker</p>
  </div>
</aside>
