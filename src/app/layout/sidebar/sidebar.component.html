<aside class="sidebar" [class.collapsed]="collapsed()">
  <!-- Brand Header -->
  <div class="sidebar-header">
    <div class="logo" [routerLink]="['/app/dashboard']" [title]="collapsed() ? pwaService.appName() : ''">
      <div class="logo-icon">
        <img src="/assets/applogo.png" alt="Logo" />
      </div>
      <div class="logo-text brand-name">{{ pwaService.appName() }}</div>
    </div>

    <!-- Close Drawer Button (Mobile) -->
    <button class="close-btn mobile-only" (click)="closeSidebar.emit()" aria-label="Close menu">
      <span class="material-icons" style="font-size: 20px;">close</span>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <span class="nav-label">MENU</span>
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="closeSidebar.emit()"
        [attr.data-tooltip]="item.label"
        [title]="collapsed() ? item.label : ''">
        <span class="nav-icon material-icons">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
        <span class="nav-arrow material-icons">chevron_right</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button
      class="footer-btn sign-out-btn"
      (click)="signOut()"
      [attr.data-tooltip]="'Sign Out'"
      [title]="collapsed() ? 'Sign Out' : ''">
      <span class="material-icons">logout</span>
      <span class="sign-out-text">Sign Out</span>
    </button>
    <div class="version">v{{ appVersion }}</div>
  </div>
</aside>
